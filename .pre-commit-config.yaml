# See https://pre-commit.com for more information
# Run with prek (https://github.com/j178/prek): `uv run prek run --all-files`
repos:
  - repo: local
    hooks:
      - id: local-ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude --exit-non-zero-on-format
        require_serial: true
        language: system
        types: [python]

      - id: local-ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude --fix --exit-non-zero-on-fix
        require_serial: true
        language: system
        types: [python]

  # Note: the type checkers (mypy + pyrefly) are configured in pyproject.toml
  # and run via CLI/CI (`uv run mypy src`, `uv run pyrefly check`), not as commit
  # hooks — they cache under the repo / re-resolve the environment, which is
  # slower and noisier than is comfortable on every commit.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5120']
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
