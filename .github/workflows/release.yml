name: Release to PyPI

# Runs when you publish a GitHub Release. It injects the bundled fallback API
# credentials (from repo secrets) into the build, then publishes to PyPI.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # required for PyPI Trusted Publishing (OIDC)

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi   # used by Trusted Publishing; harmless for token auth
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags so hatch-vcs can read the version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      # The version comes from the release tag (e.g. v0.2.0 -> 0.2.0). Pinning it
      # explicitly keeps hatch-vcs from marking the injected (dirty) tree as a dev build.
      - name: Resolve version from release tag
        run: |
          TAG='${{ github.event.release.tag_name }}'
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Build wheel + sdist (with build-time credential injection)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: bash release.sh

      # Choose the publish method automatically:
      #   - PYPI_API_TOKEN secret set  -> token auth
      #   - otherwise                  -> Trusted Publishing (OIDC)
      - name: Detect publish method
        run: echo "HAS_TOKEN=${{ secrets.PYPI_API_TOKEN != '' }}" >> "$GITHUB_ENV"

      - name: Publish to PyPI (API token)
        if: env.HAS_TOKEN == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish to PyPI (Trusted Publishing)
        if: env.HAS_TOKEN != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
